<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 210" role="img" aria-labelledby="title"><title id="title">Десять порций по 1 000 товаров</title><rect width="680" height="210" rx="15" fill="#f5f7fb"/><g font-family="system-ui,sans-serif" fill="#192943"><text x="18" y="34" font-size="21" font-weight="650">Десять порций по 1 000 товаров</text>
<rect x="18" y="65" width="57" height="48" rx="6" fill="#c8e8d9"/><text x="46" y="96" text-anchor="middle" font-size="20">1</text><rect x="83" y="65" width="57" height="48" rx="6" fill="#c8e8d9"/><text x="111" y="96" text-anchor="middle" font-size="20">2</text><rect x="148" y="65" width="57" height="48" rx="6" fill="#c8e8d9"/><text x="176" y="96" text-anchor="middle" font-size="20">3</text><rect x="213" y="65" width="57" height="48" rx="6" fill="#c8e8d9"/><text x="241" y="96" text-anchor="middle" font-size="20">4</text><rect x="278" y="65" width="57" height="48" rx="6" fill="#f6d99f"/><text x="306" y="96" text-anchor="middle" font-size="20">5</text><rect x="343" y="65" width="57" height="48" rx="6" fill="#e2e7ef"/><text x="371" y="96" text-anchor="middle" font-size="20">6</text><rect x="408" y="65" width="57" height="48" rx="6" fill="#e2e7ef"/><text x="436" y="96" text-anchor="middle" font-size="20">7</text><rect x="473" y="65" width="57" height="48" rx="6" fill="#e2e7ef"/><text x="501" y="96" text-anchor="middle" font-size="20">8</text><rect x="538" y="65" width="57" height="48" rx="6" fill="#e2e7ef"/><text x="566" y="96" text-anchor="middle" font-size="20">9</text><rect x="603" y="65" width="57" height="48" rx="6" fill="#e2e7ef"/><text x="631" y="96" text-anchor="middle" font-size="20">10</text><g font-size="17"><text x="18" y="149">1–4 · COMMIT</text><text x="247" y="149">5 · в работе</text><text x="423" y="149">6–10 · не начаты</text><text x="18" y="188">В момент запроса отмены уже сохранены 4 000 товаров.</text></g></g></svg>
