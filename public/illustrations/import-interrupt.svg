<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 210" role="img" aria-labelledby="title"><title id="title">Как просьба об отмене доходит до цикла</title><rect width="680" height="210" rx="15" fill="#f5f7fb"/><g font-family="system-ui,sans-serif" fill="#192943"><text x="18" y="34" font-size="21" font-weight="650">Как просьба об отмене доходит до цикла</text>
<g font-size="17"><rect x="16" y="52" width="648" height="39" rx="7" fill="#dce9fa"/><text x="30" y="78">1 · Обработчик вызывает future.cancel(true)</text>
<rect x="16" y="102" width="648" height="39" rx="7" fill="#e5def4"/><text x="30" y="128">2 · Исполнитель пытается прервать рабочий поток</text>
<rect x="16" y="152" width="648" height="39" rx="7" fill="#d5eee4"/><text x="30" y="178">3 · Работник проверяет флаг перед следующей порцией</text></g></g></svg>
